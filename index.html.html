<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Календарь на октябрь с вашим фото</title>
<style>
:root{--bg:#faf7f5;--fg:#2a1a1a;--card:#fff;--line:#e4d9d6;--accent:#4c2626;--accent-fg:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1313;--fg:#f3e9e7;--card:#2a1e1e;--line:#463434;--accent:#c46a6a;--accent-fg:#1c1313}}
:root[data-theme="dark"]{--bg:#1c1313;--fg:#f3e9e7;--card:#2a1e1e;--line:#463434;--accent:#c46a6a;--accent-fg:#1c1313}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif}
main{max-width:1000px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:1.6rem;font-weight:400;margin:0 0 6px}
p{margin:0 0 16px;opacity:.75;font-family:system-ui,sans-serif;font-size:.95rem}
.stage{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
canvas{display:block;width:100%;height:auto;touch-action:none;cursor:grab;}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px;font-family:system-ui,sans-serif}
button,label.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:10px 16px;font-size:.95rem;cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:not-allowed}
.zoom{display:flex;align-items:center;gap:8px;font-size:.9rem}
</style>
</head>

<main>
<h1>Календарь на октябрь</h1>

<button id="png" disabled>Скачать PNG</button>
<button id="jpg" class="alt" disabled>Скачать JPG</button>
</div>

function dims(){const s=Math.max(CLIP/img.width,H/img.height)*zm;return[img.width*s,img.height*s]}
function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#fff';ctx.fillRect(0,0,CLIP,H);
 if(img){
  ctx.save();ctx.beginPath();ctx.rect(0,0,CLIP,H);ctx.clip();
  const[dw,dh]=dims();
  ctx.drawImage(img,(CLIP-dw)*fx,(H-dh)*fy,dw,dh);
  ctx.restore();
 }else{
  ctx.fillStyle='#8a7d7a';ctx.font='96px Georgia,serif';ctx.textAlign='center';ctx.fillText('Здесь будет ваше фото',900,H/2);
 }
 if(ready)ctx.drawImage(overlay,0,0,W,H);
}
document.getElementById('f').onchange=e=>{
 const file=e.target.files[0];if(!file)return;
 const u=URL.createObjectURL(file),i=new Image();
 i.onload=()=>{img=i;fx=fy=.5;zm=1;z.value=1;['z','png','jpg'].forEach(k=>document.getElementById(k).disabled=false);draw();URL.revokeObjectURL(u)};
 i.src=u;
};
z.oninput=()=>{zm=+z.value;draw()};
let drag=null;
cv.onpointerdown=e=>{if(!img)return;drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'};
cv.onpointermove=e=>{
 if(!drag)return;
 const k=W/cv.getBoundingClientRect().width,dx=(e.clientX-drag.x)*k,dy=(e.clientY-drag.y)*k;
 drag={x:e.clientX,y:e.clientY};
 const[dw,dh]=dims();
 if(CLIP-dw!==0)fx=Math.min(1,Math.max(0,fx+dx/(CLIP-dw)));
 if(H-dh!==0)fy=Math.min(1,Math.max(0,fy+dy/(H-dh)));
 draw();
};
cv.onpointerup=cv.onpointercancel=()=>{drag=null;cv.style.cursor='grab'};
function save(type,name){
 cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove()},type,.95);
}
document.getElementById('png').onclick=()=>save('image/png','calendar-october.png');
document.getElementById('jpg').onclick=()=>save('image/jpeg','calendar-october.jpg');
